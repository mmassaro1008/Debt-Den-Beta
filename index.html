<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Debt Den">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;overscroll-behavior:none;-webkit-user-select:none;user-select:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Debt Den</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: one phone-width column; sticky 8-bit HUD, a 160x90 pixel scene per location, chunky bordered windows below. Single dark retro look by design (16-color palette). */
:root{
  --k:#1a1c2c; --p:#5d275d; --r:#b13e53; --o:#ef7d57; --y:#ffcd75; --l:#a7f070; --g:#38b764; --t:#257179;
  --n:#29366f; --b:#3b5dc9; --c:#41a6f6; --a:#73eff7; --w:#f4f4f4; --s:#94b0c2; --d:#566c86; --e:#333c57;
  --px:'Press Start 2P','Courier New',monospace;
  --vt:'VT323','Courier New',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--k);color:var(--w);font-family:var(--vt);font-size:21px;line-height:1.15;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--k)}
#app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 36px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--a);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
b{font-weight:400}
.px{font-family:var(--px)}
.muted{color:var(--s)}
.win{color:var(--l)}
.lose{color:var(--o)}

/* buttons */
.btn{font-family:var(--px);font-size:11px;line-height:1.5;min-height:48px;padding:10px 12px;background:var(--y);color:var(--k);border:3px solid var(--k);box-shadow:inset -3px -3px 0 rgba(26,28,44,.35),inset 3px 3px 0 rgba(255,255,255,.4),0 0 0 3px var(--w);text-transform:uppercase;margin:3px}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.blue{background:var(--c)}
.btn.green{background:var(--l)}
.btn.red{background:var(--r);color:var(--w)}
.btn.dim{background:var(--d);color:var(--w)}
.btn:disabled{background:var(--e);color:var(--d);box-shadow:0 0 0 3px var(--d);cursor:not-allowed}
.btn.sm{font-size:9px;min-height:40px;padding:6px 8px}
.wide{width:calc(100% - 6px)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stack{display:flex;flex-direction:column;gap:10px}

/* windows */
.box{background:var(--n);border:3px solid var(--w);box-shadow:inset 0 0 0 3px var(--e);padding:12px;display:flex;flex-direction:column;gap:10px}
.box.dark{background:var(--e)}
.lbl{font-family:var(--px);font-size:9px;color:var(--y);text-transform:uppercase;letter-spacing:.04em}
h2{font-family:var(--px);font-size:14px;color:var(--y);line-height:1.5;text-wrap:balance}
.big{font-size:34px;line-height:1;color:var(--y);font-variant-numeric:tabular-nums}

/* pixel canvases */
.pix{display:block;margin:0 auto;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--w);background:var(--k);max-width:100%}
.pix.tap{cursor:pointer}
.ico{width:48px;height:48px;image-rendering:pixelated;image-rendering:crisp-edges;flex:none}

/* title */
.title{padding-top:20px;display:flex;flex-direction:column;gap:16px;text-align:center}
.logo{font-family:var(--px);font-size:clamp(44px,14vw,68px);line-height:1.15;color:var(--y);text-shadow:4px 4px 0 var(--r),8px 8px 0 var(--p)}
.tag{color:var(--s);max-width:32ch;margin:0 auto}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* hud */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--k);border-bottom:3px solid var(--w);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:12px;align-items:end}
.hs{display:flex;flex-direction:column;min-width:0}
.hs span{font-family:var(--px);font-size:7px;color:var(--s)}
.hs b{font-size:24px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hs .cash{color:var(--y)}
.ib{font-family:var(--px);font-size:9px;padding:6px;border:3px solid var(--d);color:var(--s);min-height:34px;min-width:34px}
.due{font-size:18px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.due.warm{color:var(--y)}
.due.hot{color:var(--o)}
.due .drk{color:var(--a)}

/* nav */
.top{display:flex;align-items:center;gap:10px;margin-top:2px}
.back{font-family:var(--px);font-size:10px;color:var(--s);padding:10px 8px 10px 0}
.top h2{flex:1}
.top small{color:var(--s);font-size:18px}
.locs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.loc{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;font-family:var(--vt);font-size:18px;text-transform:none;line-height:1.1}
.loc .px{font-size:11px}
.note{background:var(--e);border:3px dashed var(--d);padding:10px;color:var(--y)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{font-family:var(--px);font-size:8px;padding:12px 2px;background:var(--e);border:3px solid var(--d);color:var(--s)}
.tab.on{background:var(--y);color:var(--k);border-color:var(--w)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;background:var(--e);border:3px solid var(--d);padding:10px}
.row h3{font-family:var(--px);font-size:10px;line-height:1.5;color:var(--w)}
.row p{color:var(--s);font-size:18px;grid-column:1}
.row .btn{grid-row:1/3;grid-column:2}
.row.hot{border-color:var(--o)}
.row.got{border-color:var(--y);background:#2c3550}
.row.lock h3{color:var(--d)}
.kv{display:flex;justify-content:space-between;gap:10px}
.kv b{font-variant-numeric:tabular-nums}

/* stocks */
.stk{display:grid;grid-template-columns:1fr auto;gap:6px 10px;background:var(--e);border:3px solid var(--d);padding:10px}
.stk h3{font-family:var(--px);font-size:10px;line-height:1.5}
.stk .pr{text-align:right;font-variant-numeric:tabular-nums}
.stk .pr b{display:block;font-size:24px;line-height:1}
.stk .acts{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stk .acts .btn{font-size:8px;min-height:38px;padding:4px 2px}
.spark{width:128px;height:40px;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.tipline{grid-column:1/-1;color:var(--a);font-size:18px}

/* skills */
.tree{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.branch{display:flex;flex-direction:column;gap:6px}
.branch .lbl{margin-bottom:2px}
.node{background:var(--e);border:3px solid var(--d);padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px}
.node h3{font-family:var(--px);font-size:8px;line-height:1.5}
.node p{font-size:17px;color:var(--s)}
.node small{font-family:var(--px);font-size:7px;color:var(--y)}
.node.own{border-color:var(--l);background:#1f3b38}
.node.own small{color:var(--l)}
.node:disabled{opacity:.55;cursor:not-allowed}

/* casino */
.games{display:grid;grid-template-columns:1fr;gap:8px}
.gtile{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;background:var(--e);border:3px solid var(--d);padding:8px 10px;text-align:left;position:relative}
.gtile h3{font-family:var(--px);font-size:11px;color:var(--y);line-height:1.5}
.gtile p{font-size:18px;color:var(--s)}
.gtile:disabled{opacity:.5;cursor:not-allowed}
.gtile .done{position:absolute;top:6px;right:8px;font-family:var(--px);font-size:7px;color:var(--l)}

/* tables */
.felt{background:var(--g);border:3px solid var(--k);box-shadow:inset 0 0 0 3px var(--t),0 0 0 3px var(--o);margin:3px;padding:14px 10px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.felt.dark{background:var(--n);box-shadow:inset 0 0 0 3px var(--b),0 0 0 3px var(--s)}
.msg{text-align:center;min-height:24px;font-size:20px}
.msg em{font-style:normal;color:var(--a)}
.hand{display:flex;flex-direction:column;gap:6px;align-items:center}
.hlab{font-family:var(--px);font-size:8px;color:var(--w)}
.cards{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;min-height:64px}
.cardf{width:44px;height:62px;background:var(--w);color:var(--k);border:3px solid var(--k);box-shadow:3px 3px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:space-between;padding:3px 4px;font-family:var(--px);font-size:11px}
.cardf .su{align-self:flex-end;font-family:var(--vt);font-size:30px;line-height:.75}
.cardf.red{color:var(--r)}
.cardb{width:44px;height:62px;border:3px solid var(--w);background:repeating-conic-gradient(var(--r) 0 25%,var(--p) 0 50%) 0 0/8px 8px;box-shadow:3px 3px 0 rgba(0,0,0,.45)}
.cslot{width:44px;height:62px;border:3px dashed rgba(244,244,244,.35)}
.ph{color:var(--w);opacity:.75;font-size:18px;align-self:center}
.hint{text-align:center;color:var(--a);font-size:19px}

/* bet bar */
.betbar{background:var(--e);border:3px solid var(--d);padding:8px;display:flex;flex-direction:column;gap:8px}
.betval{display:flex;justify-content:space-between;align-items:baseline}
.betval b{font-size:28px;color:var(--y);line-height:1;font-variant-numeric:tabular-nums}
.betval{gap:8px;align-items:center}
.betin{display:flex;align-items:center;gap:2px;font-size:28px;color:var(--y)}
.betin input{width:8.5ch;font-family:var(--vt);font-size:28px;line-height:1;color:var(--y);background:var(--k);border:3px solid var(--d);padding:4px 6px;text-align:right;font-variant-numeric:tabular-nums;border-radius:0}
.betin input:focus{outline:none;border-color:var(--y)}
.betin input:disabled{opacity:.5}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chip{font-family:var(--px);font-size:9px;min-height:40px;background:var(--n);border:3px solid var(--s);color:var(--w)}
.chip:disabled{opacity:.4;cursor:not-allowed}

/* choice buttons */
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.opt{font-family:var(--px);font-size:9px;line-height:1.5;padding:8px 2px;background:var(--e);border:3px solid var(--d);display:flex;flex-direction:column;align-items:center;gap:2px}
.opt small{font-family:var(--vt);font-size:16px;color:var(--s)}
.opt.on{background:var(--n);border-color:var(--y);color:var(--y)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.o-red{color:var(--o)}
.o-zero{color:var(--l)}
.stepper{display:flex;justify-content:center;align-items:center;gap:14px}
.stepper b{font-size:34px;min-width:52px;text-align:center}

/* roulette / coin */
.wheel{width:112px;height:112px;margin:0 auto;display:grid;place-items:center;font-family:var(--px);font-size:30px;background:var(--e);border:6px solid var(--k);box-shadow:0 0 0 4px var(--y),inset 0 0 0 4px var(--o);clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.wheel.r{background:var(--r)}.wheel.b{background:var(--k)}.wheel.z{background:var(--g)}
.hist{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;min-height:22px}
.hist i{font-style:normal;font-family:var(--px);font-size:8px;min-width:24px;height:20px;padding:0 3px;display:grid;place-items:center}
.hist .r{background:var(--r)}.hist .b{background:var(--k)}.hist .z{background:var(--g)}.hist .m{background:var(--e)}.hist .m.lose{color:var(--o)}
.coin{width:104px;height:104px;margin:0 auto;display:grid;place-items:center;font-family:var(--px);font-size:34px;background:var(--y);color:var(--o);border:6px solid var(--o);box-shadow:inset -6px -6px 0 rgba(0,0,0,.18);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.coin.t{background:var(--s);color:var(--d);border-color:var(--d)}

/* mines */
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:330px;width:100%;margin:0 auto}
.mcell{aspect-ratio:1;background:var(--e);border:3px solid var(--d);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3);font-family:var(--px);font-size:16px}
.mcell:disabled{cursor:default}
.mcell.gem{background:var(--t);border-color:var(--a);color:var(--a)}
.mcell.mine{background:var(--p);color:var(--o)}
.mcell.boom{background:var(--o);color:var(--k)}
.mopts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

/* poker */
.pk{gap:12px;padding:12px 8px}
.pkrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pkrow .cards{min-height:0;flex-wrap:nowrap}
.pkwho{display:flex;flex-direction:column;gap:2px;min-width:0}
.pkwho b{font-family:var(--px);font-size:11px;display:flex;align-items:center;gap:6px}
.pkwho span{font-size:18px;color:var(--w)}
.dchip{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;background:var(--w);color:var(--k);font-family:var(--px);font-size:8px}
.board{display:flex;gap:4px;justify-content:center}
.board .cardf,.board .cslot{width:min(44px,16vw)}
.pot{text-align:center;font-family:var(--px);font-size:10px;color:var(--y)}
.odds{background:var(--k);border:3px solid var(--y);padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:2px 10px}
.odds b{color:var(--y);font-size:24px}
.odds .po{flex-basis:100%;color:var(--s);font-size:17px}
.pklog{font-size:17px;color:var(--s);display:flex;flex-direction:column;gap:2px}
.raises{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* misc */
.ending{text-align:center;display:flex;flex-direction:column;gap:12px;padding:20px 12px;border:3px solid var(--o);box-shadow:inset 0 0 0 3px var(--p);background:var(--e)}
.ending h1{font-family:var(--px);font-size:clamp(26px,9vw,40px);color:var(--o);line-height:1.3}
.confirm{background:var(--p);border:3px solid var(--o);padding:12px;display:flex;flex-direction:column;gap:10px;text-align:left}
.ticket{background:var(--w);color:var(--k);border:3px dashed var(--r);padding:10px;text-align:center;font-size:22px}
.ticket b{font-family:var(--px);font-size:16px;color:var(--r)}
table.odd{width:100%;border-collapse:collapse;font-size:19px}
table.odd td{padding:4px 2px;border-bottom:2px solid var(--e)}
table.odd td:last-child{text-align:right}
.lvl{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--px);font-size:9px;color:var(--y)}
.xpbar{flex:1;max-width:170px;height:14px;border:3px solid var(--w);background:var(--k)}
.xpbar i{display:block;height:100%;background:var(--l)}
.prog{grid-column:1/-1;height:10px;border:2px solid var(--d);background:var(--k);margin-top:4px}
.prog i{display:block;height:100%;background:var(--y)}
.linkb{color:var(--a);text-decoration:underline;font-size:18px;padding:4px 0}
.pad{display:grid;grid-template-columns:62px 1fr 62px;gap:6px;align-items:stretch;touch-action:none;-webkit-user-select:none;user-select:none}
.padb{font-family:var(--px);font-size:20px;min-height:58px;background:var(--e);border:3px solid var(--w);color:var(--w);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35);touch-action:none;-webkit-user-select:none;user-select:none}
.padb:active{background:var(--n);color:var(--y)}
.btn.act{font-size:10px;min-height:58px;text-transform:none;line-height:1.5}
canvas.world{touch-action:none;-webkit-user-select:none;user-select:none}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.seat{display:flex;justify-content:space-between;align-items:center;gap:4px;background:var(--e);border:3px solid var(--d);padding:5px 6px;min-width:0}
.seat .si{min-width:0;display:flex;flex-direction:column}
.seat b{font-family:var(--px);font-size:8px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat b em{font-style:normal;color:var(--y)}
.seat span{font-size:16px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .hn{color:var(--a)}
.seat.turn{border-color:var(--y);background:var(--n)}
.seat.out{opacity:.5}
.seat.won{border-color:var(--l)}
.mcs{display:flex;gap:2px;flex:none}
.mc{width:20px;height:28px;background:var(--w);color:var(--k);border:2px solid var(--k);font-family:var(--px);font-size:7px;line-height:1.3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mc.red{color:var(--r)}
.mb{display:block;width:20px;height:28px;border:2px solid var(--w);background:repeating-conic-gradient(var(--r) 0 25%,var(--p) 0 50%) 0 0/6px 6px}
.hand.cur{outline:3px dashed var(--y);outline-offset:4px}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--k);border:3px solid var(--y);padding:8px}
.reel{height:80px;display:grid;place-items:center;background:var(--w);color:var(--k);font-family:var(--px);font-size:26px;border:3px solid var(--d)}
.reel.s7,.reel.sh{color:var(--r)}.reel.sd{color:var(--g)}.reel.sst{color:var(--o)}.reel.sbar{font-size:15px}
.paytable{display:grid;grid-template-columns:repeat(4,1fr);gap:2px 8px;font-size:16px;color:var(--w)}
.paytable span{display:flex;justify-content:space-between;gap:4px}
.paytable b{color:var(--y)}
.kgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.kcell{aspect-ratio:1;background:var(--k);font-family:var(--px);font-size:9px;border:2px solid var(--d);color:var(--w)}
.kcell:disabled{cursor:default}
.kcell.pick{background:var(--y);color:var(--k)}
.kcell.drawn{background:var(--p)}
.kcell.hit{background:var(--l);color:var(--k);border-color:var(--w)}
.tw{display:flex;flex-direction:column;gap:4px}
.twr{display:grid;gap:4px;align-items:center}
.twm{font-family:var(--px);font-size:8px;color:var(--y);text-align:right;padding-right:4px}
.tcell{height:30px;background:var(--e);border:3px solid var(--d);font-family:var(--px);font-size:12px;color:var(--w)}
.tcell:disabled{cursor:default}
.tcell.cur{border-color:var(--y);background:var(--b)}
.tcell.gem{background:var(--t);color:var(--a);border-color:var(--a)}
.tcell.egg{background:var(--p);color:var(--o)}
.tcell.boom{background:var(--o);color:var(--k)}
.vpc{display:flex;gap:4px;justify-content:center}
.vpcard{display:flex;flex-direction:column;align-items:center;gap:4px}
.vpcard:disabled{cursor:default}
.held{font-family:var(--px);font-size:8px;color:var(--y);min-height:10px}
table.odd tr.hit td{color:var(--y)}
.rboard{display:grid;grid-template-columns:repeat(3,1fr) 58px;gap:3px}
.rn{position:relative;min-height:36px;font-family:var(--px);font-size:11px;color:var(--w);border:2px solid var(--k);padding:0}
.rn.r{background:var(--r)}.rn.b{background:var(--k);border-color:var(--e)}.rn.z{background:var(--g)}
.rn.cov{outline:2px dashed var(--y);outline-offset:-6px}

let SEEN=new Map(),ANIM_UNTIL=0,PENDING_FX=null,LAST_CASH=null,LAST_SCENE_KEY='',ROLL_ID=0;
function animateNew(){
  const sk=UI.scene+':'+(UI.scene==='game'?UI.game:UI.scene==='world'?UI.room:'');
  if(sk!==LAST_SCENE_KEY){app.classList.remove('scenein');void app.offsetWidth;if(!RM)app.classList.add('scenein')}
  const fresh=sk!==LAST_SCENE_KEY;LAST_SCENE_KEY=sk;
  const next=new Map(),news=[];
  app.querySelectorAll('[data-ck]').forEach(el=>{const k=el.dataset.ck,st=(el.classList.contains('cardb')||el.classList.contains('mb'))?'b':'f';next.set(k,st);
    if(fresh||RM)return;const prev=SEEN.get(k);
    if(prev===undefined)news.push([+(el.dataset.ord||0),el,el.dataset.fx||'deal']);else if(prev==='b'&&st==='f')news.push([+(el.dataset.ord||0),el,'flip'])});
  SEEN=next;if(!news.length){ANIM_UNTIL=0;return 0}
  news.sort((a,b)=>a[0]-b[0]);const gap=news.length>6?70:180;let t=0;
  news.forEach(([,el,kind],i)=>{const d=i*gap;el.style.animationDelay=d+'ms';el.classList.add(kind);t=d+(kind==='boomk'?450:300);if(kind==='deal'||kind==='flip')setTimeout(()=>SFX.card(),d)});
  app.querySelectorAll('[data-after]').forEach(el=>{el.style.animationDelay=t+'ms';el.classList.add('after')});

function rollCash(delay){
  if(!S){LAST_CASH=null;return}const to=Math.round(S.cash),el=$('.hs .cash');
  if(!el||LAST_CASH==null||LAST_CASH===to||RM){LAST_CASH=to;return}
  const from=LAST_CASH,id=++ROLL_ID;LAST_CASH=to;el.textContent=fmt(from);const t0=performance.now()+delay,D=Math.abs(to-from)>=1000?900:550;
  const step=t=>{if(id!==ROLL_ID)return;const e=$('.hs .cash');if(!e)return;if(t<t0){requestAnimationFrame(step);return}
    const u=Math.min(1,(t-t0)/D),v=from+(to-from)*(1-Math.pow(1-u,3));e.textContent=fmt(v);e.classList.toggle('up',to>from);e.classList.toggle('down',to<from);
    if(u<1)requestAnimationFrame(step);else{e.textContent=fmt(to);setTimeout(()=>{const f=$('.hs .cash');if(f&&id===ROLL_ID)f.classList.remove('up','down')},500)}};
  requestAnimationFrame(step);
}

function burst(kind,n,o){
  if(RM)return;o=o||{};const c=fxCanvas(),W=c.width,H=c.height;
  for(let i=0;i<n;i++){
    if(kind==='coin')FXP.push(o.rain?{k:'coin',x:Math.random()*W,y:-8-Math.random()*H,vx:(Math.random()-.5)*16,vy:15+Math.random()*30,ph:Math.random()*6,life:4.5}:{k:'coin',x:W/2+(Math.random()-.5)*16,y:H*.45,vx:(Math.random()-.5)*130,vy:-70-Math.random()*100,ph:Math.random()*6,life:2.8});
    else if(kind==='spark'){const a=Math.random()*Math.PI*2,v=40+Math.random()*90;FXP.push({k:'spark',x:W/2,y:H*.45,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.5+Math.random()*.5,col:[C.y,C.w,C.a,C.l][i%4],ng:1})}
    else if(kind==='shard')FXP.push({k:'shard',x:Math.random()*W,y:-6-Math.random()*H*.5,vx:(Math.random()-.5)*12,vy:10+Math.random()*30,life:3,col:[C.d,C.e,C.s,C.r][i%4],ph:Math.random()*6});
    else if(kind==='crack'){const pts=[];let x=W/2+(Math.random()-.5)*20,y=H*.42,a=Math.random()*Math.PI*2;for(let s=0;s<60;s++){a+=(Math.random()-.5)*.9;x+=Math.cos(a)*1.5;y+=Math.sin(a)*1.5;pts.push([Math.round(x),Math.round(y)])}FXP.push({k:'crack',pts,life:1.8,ng:1,vx:0,vy:0,x:0,y:0})}
  }
  if(fxRAF)return;let last=performance.now();
  const loop=t=>{const dt=Math.min(.05,(t-last)/1000);last=t;const cv=fxCanvas(),x=cv.getContext('2d');x.clearRect(0,0,cv.width,cv.height);
    FXP=FXP.filter(p=>(p.life-=dt)>0);
    for(const p of FXP){if(!p.ng)p.vy+=150*dt;else{p.vx*=.96;p.vy*=.96}p.x+=p.vx*dt;p.y+=p.vy*dt;p.ph=(p.ph||0)+dt*11;
      if(p.k==='coin'){const w=Math.max(1,Math.round(Math.abs(Math.cos(p.ph))*5)),X=Math.round(p.x-w/2),Y=Math.round(p.y);x.fillStyle=C.o;x.fillRect(X,Y,w,5);if(w>2){x.fillStyle=C.y;x.fillRect(X+1,Y+1,w-2,3)}}
      else if(p.k==='spark'){x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),2,2)}
      else if(p.k==='shard'){x.fillStyle=p.col;x.fillRect(Math.round(p.x),Math.round(p.y),Math.max(1,Math.round(Math.abs(Math.sin(p.ph))*4)),2)}
      else if(p.k==='crack'){const n=Math.min(p.pts.length,Math.round((1.8-p.life)*120));x.fillStyle=C.w;for(let i=0;i<n;i++)x.fillRect(p.pts[i][0],p.pts[i][1],1,1)}}
    if(FXP.length)fxRAF=requestAnimationFrame(loop);else{fxRAF=null;x.clearRect(0,0,cv.width,cv.height)}};
  fxRAF=requestAnimationFrame(loop);
}

function clampBet(){if(!S)return 0;const c=Math.floor(Math.min(S.cash,mod('low')?250:Infinity));return Math.max(c>=1?1:0,Math.min(Math.round(UI.bet)||0,c))}
function canPlay(){return!!S&&!S.over&&S.energy>0&&S.cash>=1&&clampBet()>=1}
function busy(){if(!S)return false;const g=S.g;return g.bj.phase==='play'||g.mn.phase==='play'||(g.pk.seated&&g.pk.phase==='play')||g.rl.busy||g.pl.busy||g.fl.busy||g.sn.busy||g.sl.busy||g.wh.busy||g.kn.busy||g.cr.phase==='fly'||g.tw.phase==='play'||g.vp.phase==='hold'||g.pg.phase==='play'}
function placeBet(game,b){
  S.cash-=b;S.energy--;const st=gs(game);st.r++;st.bet+=b;addXP(2);checkTiers();
  if(!S.today.games.includes(game)){S.today.games.push(game);if(S.today.games.length>=7)ach('tourist')}
  save();
}
function settle(game,bet,gross){
  let note='';const win=gross>bet+.001;
  if(win){
    let m=1+.05*(sk('luck1')+sk('luck2'))+(S.charm?.1:0)+.01*L('luck');
    if(S.drink){m*=S.drink.m;note=`${S.drink.name} ${S.drink.m}x`;S.drink=null}
    else if(m>1)note=`+${Math.round((m-1)*100)}% bonus`;
    gross=bet+(gross-bet)*m;
  }
  gross=Math.round(gross);S.cash+=gross;const net=gross-bet;
  if(net>0){ach('first');S.stats.won+=net;if(net>S.stats.biggest)S.stats.biggest=net;const st=gs(game);st.w++;if(net>st.big)st.big=net;M.stats.wins++;if(net>M.stats.big)M.stats.big=net;}
  queueFX(net,bet,S.cash-gross+bet);
  checkCash();checkTiers();save();
  return{net,note};
}

const GL={J:'001001001101010',Q:'010101101110011',Z:'111001010100111',A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',0:'111101101101111',1:'010110010010111',2:'110001010100111',3:'110001010001110',4:'101101111001001',5:'111100110001110',6:'011100111101111',7:'111001010010010',8:'111101111101111',9:'111101111001110',$:'011110010011110',' ':'000000000000000','!':'010010010000010','-':'000000111000000','.':'000000000000010'};

  else{let q=v==='sall'?st.own:Math.min(+v.slice(1),st.own);if(q<1)return;const avg=st.cost/st.own;if(st.p>=2*avg)ach('stock2');S.cash+=q*st.p;st.own-=q;st.cost-=avg*q;if(st.own===0)st.cost=0;SFX.coin()}

function sleep(){

  S.day++;S.energy=maxEnergy();S.today={games:[],buy:{},bar:0};S.charm=false;S.tipK=sk('insider')?Object.keys(TICK)[Math.floor(rnd()*4)]:null;
  for(const k in S.stocks){const st=S.stocks[k];st.p=Math.max(.01,st.p*S.next[k]);st.h.push(st.p);if(st.h.length>24)st.h.shift()}
  for(const k in S.stocks){const st=S.stocks[k];if(st.short&&2*st.sColl-st.short*st.p<=0){st.short=0;st.sColl=0;toast(`Margin call: your ${k} short was wiped out.`)}}
  S.next=rollMoves();
  if(S.day>=8)ach('week');if(S.day>=31)ach('month');if(S.day>=366)ach('year');
  M.stats.days++;addXP(10);
  S.mods.forEach(k=>M.modBest[k]=Math.max(M.modBest[k]||0,S.day));

}

function drawSpark(x,k){
  const h=S.stocks[k].h,W=64,H=20;px(x,C.k,0,0,W,H);
  for(let i=0;i<W;i+=8)px(x,'#232640',i,0,1,H);
  const mn=Math.min(...h),mx=Math.max(...h),rg=mx-mn||1;const up=h[h.length-1]>=h[0];
  let py=null;h.forEach((v,i)=>{const X=Math.round(i*(W-1)/Math.max(1,h.length-1)),Y=Math.round(H-2-(v-mn)/rg*(H-4));

function martBuy(k){
  const it=MART[k],pr=mprice(k),n=S.today.buy[k]||0;if(n>=it.lim||S.cash<pr)return;
  S.cash-=pr;S.today.buy[k]=n+1;M.items++;if(M.items>=100)ach('items100');SFX.coin();

    UI.martMsg=`<div class="ticket">${prize?`WINNER <b>${fmt(prize)}</b>`:'No luck. <b>TRY AGAIN</b>'}</div>`;if(prize)SFX.win()}

const barPrice=()=>r5(25*(1+.15*(S.day-1))*disc());
function barBuy(){
  if(S.today.bar>=3||S.cash<barPrice())return;S.cash-=barPrice();S.today.bar++;

  const name=DRINKS[Math.floor(rnd()*DRINKS.length)];S.drink={name,m};if(m>=3)ach('drink3');
  UI.barMsg=m>=2?`"${name}. You look lucky tonight." Your next win pays <b>${m}x</b> profit.`:m>=1?`"${name}, on the house... almost." Your next win pays <b>${m}x</b> profit.`:`"Uh, that one was mixed wrong." Your next win pays only <b>${m}x</b> profit.`;

  <p class="msg">${s.msg||'&nbsp;'}</p>${betBar(s.busy)}<button class="btn green wide" data-a="sl" ${!s.busy&&canPlay()?'':'disabled'}>Pull the lever</button>`;
}
function gWH(){
  const s=S.g.wh;
  return`<canvas class="pix" data-s="wheel" width="160" height="48" data-max="4" aria-label="Money wheel"></canvas>
  <div class="hist">${s.hist.map(g=>`<i class="m" style="color:${WCOL[g]===C.k?C.s:WCOL[g]}">${WNAME[g][0]}</i>`).join('')}</div>
  <div class="opts">${['B','G','R','Y'].map(k=>`<button class="opt ${s.pick===k?'on':''}" data-a="whpick" data-v="${k}" ${s.busy?'disabled':''}><span style="color:${WCOL[k]}">${WNAME[k]}</span><small>pays ${WPAY[k]}x · ${WSEG.filter(x=>x===k).length}/30</small></button>`).join('')}</div>
  <p class="msg">${s.msg||'One black House slot means everyone loses.'}</p>${betBar(s.busy)}<button class="btn green wide" data-a="wh" ${!s.busy&&canPlay()?'':'disabled'}>Spin the wheel</button>`;
}
function gBC(){
  const s=S.g.bc;
  return`<div class="felt"><div class="hand"><span class="hlab">PLAYER${s.p.length?' · '+btot(s.p):''}</span><div class="cards">${s.p.map((c,i)=>face(c,`bc${s.n}p${i}`,i*2)).join('')||'<p class="ph">Closest to 9 wins</p>'}</div></div>
  <div class="hand"><span class="hlab">BANKER${s.bk.length?' · '+btot(s.bk):''}</span><div class="cards">${s.bk.map((c,i)=>face(c,`bc${s.n}b${i}`,i*2+1)).join('')||'<p class="ph">Tens and faces count as 0</p>'}</div></div></div>
  <div class="opts" style="grid-template-columns:repeat(3,1fr)">${[['player','Player','2x'],['banker','Banker','1.95x'],['tie','Tie','9x']].map(([k,l,m])=>`<button class="opt ${s.pick===k?'on':''}" data-a="bcpick" data-v="${k}">${l}<small>pays ${m}</small></button>`).join('')}</div>
  <p class="msg" data-after>${s.msg||'Player and Banker bets push on a tie.'}</p>${betBar(false)}<button class="btn green wide" data-a="bc" ${canPlay()?'':'disabled'}>Deal</button>`;
}
function gCR(){
  const s=S.g.cr,fly=s.phase==='fly';
  return`<canvas class="pix" data-s="crash" width="160" height="70" data-max="4" aria-label="Crash rocket chart"></canvas>
  <div class="hist">${s.hist.map(h=>`<i class="m ${h.w?'':'lose'}">${h.c.toFixed(2)}x</i>`).join('')}</div>
  <div class="opts" style="grid-template-columns:repeat(6,1fr)">${[0,1.5,2,3,5,10].map(a=>`<button class="opt ${s.auto===a?'on':''}" data-a="crauto" data-v="${a}" ${fly?'disabled':''}>${a?a+'x':'Off'}<small>auto</small></button>`).join('')}</div>
  <p class="msg">${s.msg||'Set an auto cash-out, or tap Cash out before it blows.'}</p>
  ${fly?`<button class="btn green wide" id="crcash" data-a="crcash">Cash out ${fmt(s.bet*s.cur)}</button>`:betBar(false)+`<button class="btn green wide" data-a="cr" ${canPlay()?'':'disabled'}>Launch</button>`}`;
}
function gTW(){
  const s=S.g.tw,play=s.phase==='play',done=s.phase==='done',n=TDIFF[s.diff].cols;
  let rows='';for(let f=7;f>=0;f--){let cells='';for(let c=0;c<n;c++){let cls='tcell',t='';
      if(s.picks[f]===c&&(f<s.floor||(done&&f===s.floor&&s.eggs[f]!==c))){cls+=' gem';t='◆'}
      else if(done&&s.eggs&&s.eggs[f]===c){cls+=' egg'+(s.picks[f]===c?' boom':'');t='●'}
      else if(play&&f===s.floor)cls+=' cur';
      cells+=`<button class="${cls}" ${t?`data-ck="tw${s.n||0}f${f}c${c}${t==='◆'?'g':'e'}" data-fx="${cls.includes('boom')?'boomk':'pop'}" data-ord="${cls.includes('boom')?0:8-f}"`:''} data-a="tw" data-v="pick" data-i="${c}" ${play&&f===s.floor?'':'disabled'} aria-label="Floor ${f+1} door ${c+1}">${t}</button>`}
    rows+=`<div class="twr" style="grid-template-columns:52px repeat(${n},1fr)"><span class="twm">${twMult(f+1,s.diff)}x</span>${cells}</div>`}
  return`<div class="felt dark"><div class="tw">${rows}</div></div>
  <div class="opts" style="grid-template-columns:repeat(3,1fr)">${Object.entries(TDIFF).map(([k,d])=>`<button class="opt ${s.diff===k?'on':''}" data-a="tw" data-v="diff" data-i="${k}" ${play?'disabled':''}>${d.n}<small>1 egg in ${d.cols}</small></button>`).join('')}</div>
  <p class="msg">${s.msg||'Pick one door per floor. One hides a dragon egg.'}</p>
  ${play?`<button class="btn green wide" data-a="tw" data-v="cash" ${s.floor?'':'disabled'}>Cash out${s.floor?' '+fmt(s.bet*twMult(s.floor,s.diff)):''}</button>`:betBar(false)+`<button class="btn green wide" data-a="tw" data-v="start" ${canPlay()?'':'disabled'}>Start climbing</button>`}`;
}
function gKN(){
  const s=S.g.kn;
  const cells=Array.from({length:40},(_,j)=>{const n=j+1,p=s.picks.includes(n),d=s.drawn.includes(n);return`<button class="kcell ${p?'pick':''} ${d?(p?'hit':'drawn'):''}" id="kn${n}" data-a="kn" data-v="pick" data-i="${n}" ${s.busy?'disabled':''}>${n}</button>`}).join('');
  const left=5-s.picks.length;
  return`<div class="felt dark"><div class="kgrid">${cells}</div><div class="paytable">${Object.entries(KPAY).map(([h,m])=>`<span>${h} hits <b>${m}x</b></span>`).join('')}</div></div>
  <div class="g2"><button class="btn dim" data-a="kn" data-v="quick" ${s.busy?'disabled':''}>Quick pick</button><button class="btn dim" data-a="kn" data-v="clear" ${s.busy?'disabled':''}>Clear</button></div>
  <p class="msg">${s.msg||(left?`Pick ${left} more number${left===1?'':'s'}.`:'Ready to draw.')}</p>${betBar(s.busy)}<button class="btn green wide" data-a="kn" data-v="go" ${!s.busy&&canPlay()&&!left?'':'disabled'}>Draw 10 balls</button>`;
}
function gVP(){
  const s=S.g.vp,hold=s.phase==='hold';const cur=s.hand.length?vpEval(s.hand)[0]:'';
  const cards=s.hand.length?s.hand.map((c,i)=>`<button class="vpcard" data-a="vp" data-v="hold" data-i="${i}" ${hold?'':'disabled'} aria-label="Hold card ${i+1}">${face(c,`vp${s.n}i${i}x${c.r}${c.s}`,i)}<span class="held">${hold&&s.hold[i]?'HELD':s.phase==='done'&&s.hold[i]?'HELD':'&nbsp;'}</span></button>`).join(''):'<p class="ph">Five cards. Hold the ones you want, then draw once.</p>';
  return`<div class="felt"><div class="vpc">${cards}</div></div>
  <div class="box dark"><table class="odd">${VPAY.map(([n,m])=>`<tr class="${(hold&&cur===n)||(s.phase==='done'&&s.res===n)?'hit':''}"><td>${n}</td><td>${m}x</td></tr>`).join('')}</table></div>
  <p class="msg" data-after>${hold?`Tap cards to hold. ${cur!=='Nothing'?'You have: '+cur+'.':''}`:s.msg||'&nbsp;'}</p>
  ${hold?`<button class="btn green wide" data-a="vp" data-v="draw">Draw</button>`:betBar(false)+`<button class="btn green wide" data-a="vp" data-v="deal" ${canPlay()?'':'disabled'}>Deal</button>`}`;
}
function gPG(){
  const s=S.g.pg,play=s.phase==='play';
  return`<canvas class="pix" data-s="penguin" data-anim width="160" height="60" data-max="4" aria-label="Penguin crossing the road"></canvas>
  <div class="opts" style="grid-template-columns:repeat(2,1fr)">${Object.entries(PDIFF).map(([k,d])=>`<button class="opt ${s.diff===k?'on':''}" data-a="pg" data-v="diff" data-i="${k}" ${play?'disabled':''}>${d.n}<small>${Math.round(d.p*100)}% chance of a car per lane · 10 lanes pays ${pgMult(10,k)}x</small></button>`).join('')}</div>
  <p class="msg">${s.msg||'Each hop risks a car. Cash out whenever you like.'}${play?` <em>Next lane: ${pgMult(s.lane+1,s.diff)}x</em>`:''}</p>
  ${play?`<div class="g2"><button class="btn" data-a="pg" data-v="hop">Hop</button><button class="btn green" data-a="pg" data-v="cash" ${s.lane?'':'disabled'}>Cash out${s.lane?' '+fmt(s.bet*pgMult(s.lane,s.diff)):''}</button></div>`:betBar(false)+`<button class="btn green wide" data-a="pg" data-v="start" ${canPlay()?'':'disabled'}>Start crossing</button>`}`;
}
function vOver(){
  const o=S.over;const na=S.newAch.map(id=>`<div class="row got"><h3>★ ${ACH[id][0]}</h3><p>${ACH[id][1]}</p></div>`).join('');
  return`<section class="stack" style="padding-top:20px;gap:14px"><div class="ending"><span class="lbl">Day ${o.day}</span><h1>GAME OVER</h1><p>${o.reason==='bankrupt'?'You filed for bankruptcy. The repo man takes the TV, the bed and the snail.':'You slept through a payment. The collectors took everything, including the hot dog.'}</p></div>
  <div class="box"><div class="kv"><span>Days survived</span><b>${o.day}</b></div><div class="kv"><span>Debts paid</span><b>${o.paid}</b></div><div class="kv"><span>Most cash at once</span><b>${fmt(o.peak)}</b></div><div class="kv"><span>Biggest single win</span><b>${fmt(o.biggest)}</b></div><div class="kv"><span>Best run ever</span><b>Day ${M.best}</b></div>
  <div class="kv"><span>Rep earned</span><b class="win">+${o.rep||0} <span class="muted">(${o.base||0} x ${(o.mult||1).toFixed(2)})</span></b></div></div>
  ${lvlBar()}
  ${na?`<span class="lbl">New trophies</span>${na}`:''}
  <button class="btn green wide" data-a="again">${S.daily?'New run':'Run it back'}</button><div class="g2"><button class="btn" data-a="nav" data-v="legacy">Spend Rep</button><button class="btn dim" data-a="nav" data-v="title">Title</button></div></section>`;
}
function vTrophies(){return topbar('Trophies','title')+`<p class="muted">${trophyCount()} of ${trophyTotal()} unlocked.</p>`+trophyView()}
function vHow(){return topbar('How to play','title')+`<div class="box">
  <p><b class="px" style="font-size:10px;color:var(--y)">THE DEAL.</b> You start with $100 and two debts. Each one has a due day. Pay it at your home computer before you sleep on that day, or the collectors end your run.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">DEBTS GROW.</b> Paying a debt brings in a new, bigger one, due a couple of days later. See how long you can last.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">ENERGY.</b> Every casino round costs 1 energy. Sleep to refill it, or buy snacks at the Mart.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">SKILLS.</b> Each paid debt gives a skill point to spend on more energy, bigger wins, cheaper shopping or smarter play.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">GETTING AROUND.</b> Walk with the arrow buttons (or arrow keys), or tap where you want to go. Press the big button to use whatever you’re standing next to: doors, your computer, your bed, the clerk, the bartender and every casino game.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">UNLOCKS.</b> Seven games are open on day 1. Paying off debts opens more: Slots at 1, Money Wheel at 2, Baccarat at 3, Crash at 4, Dragon Tower at 5, Keno at 6, Video Poker at 8 and Penguin Cross at 10. The boarded-up Mart can be reopened once you’ve paid off 3 debts.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">STOCKS.</b> Four stocks move once a night. Buy to bet on a rise, or short to bet on a fall. An Insider Tip from the Mart shows tomorrow’s move for one random stock.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">THE BAR.</b> A drink multiplies the profit on your next win, from 0.1x up to 3x.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">POKER.</b> A full 8-handed table with a real 52-card deck and side pots. Your odds against the players still in the hand come from simulating thousands of run-outs, and all-in odds are exact once one or two cards are left to come.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">REP &amp; LEGACY.</b> Every run pays Rep when it ends. Leveling up and trophy ladders pay Rep too. Spend it on permanent Legacy upgrades and wardrobe items.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">HEAT.</b> Reach day 15 at your highest Heat to unlock the next level, up to 30. Higher Heat means bigger debts and more Rep.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">CONTRACTS.</b> Optional rules that make a run harder for more Rep. New ones unlock as you level up.</p>
  <p><b class="px" style="font-size:10px;color:var(--y)">DAILY HUSTLE.</b> One set of contracts per day, the same for everyone. Play it on back-to-back days to build a streak.</p>
  <p class="muted">Play money only. Progress saves on this device.</p></div>`}

function render(){
  if(['street','home','casino','mart','bar'].includes(UI.scene)){UI.room=UI.scene;UI.scene='world'}
  if(['world','game'].includes(UI.scene)&&(!S||S.over))UI.scene='title';
  if(UI.scene==='over'&&(!S||!S.over))UI.scene='title';
  if(UI.scene==='world'&&S&&UI.room!=='street'&&UI.room!=='home'&&!placeOpen(UI.room)){UI.room='street'}
  if(UI.scene==='world'&&S&&UI.room==='mart'&&!S.martOpen)UI.room='street';
  if(UI.scene==='game'&&S&&(!gameOpen(UI.game)||S.paid<GAMES[UI.game].req)){UI.scene='world';UI.room='casino'}
  const v={title:vTitle,world:vWorld,game:vGame,over:vOver,trophies:vTrophies,how:vHow,setup:vSetup,legacy:vLegacy,stats:vStats}[UI.scene]||vTitle;
  app.innerHTML=v();fitPix();drawScenes();
  {const t=animateNew();rollCash(t);flushFX(t)}
  if(UI.scene==='world')updatePrompt();
  if(S&&!S.over&&S.g.pk.seated&&S.g.pk.phase==='play'&&S.g.pk.toAct>0)pkSchedule();
}
let lastScene=null;
const ROOMN=['street','home','casino','mart','bar'];
function act(a,v,el){
  switch(a){
    case 'nav':
      if(busy()&&UI.scene==='game')return;
      if(UI.scene==='game'&&UI.game==='holdem'&&S&&S.g.pk.seated)pkLeave(true);
      if(ROOMN.includes(v)){if(S&&!placeOpen(v)){toast('Closed by your contract.');v='street'}UI.scene='world';UI.room=v;UI.panel=null;UI.confirm=null;break}
      UI.scene=v;UI.confirm=null;break;
    case 'continue':UI.scene='world';UI.panel=null;break;
    case 'interact':{const sp=nearSpot();if(sp)interact(sp.id);return}
    case 'leave':enterRoom('street',UI.room);return;
    case 'closep':UI.panel=null;UI.confirm=null;UI.martMsg='';UI.barMsg='';break;
    case 'lease':{const c=leaseCost();if(S.paid<3||S.cash<c||S.martOpen)return;S.cash-=c;S.martOpen=true;ach('reopen');SFX.win();toast('The Mart is open for business.');UI.panel=null;save();enterRoom('mart');return}
    case 'new':if(S&&!S.over&&UI.scene==='title'){UI.confirm='new';break}UI.scene='setup';UI.confirm=null;break;
    case 'newyes':UI.scene='setup';UI.confirm=null;break;
    case 'daily':if(S&&!S.over){UI.confirm='daily';break}newRun(dailyCfg());return;
    case 'dailyyes':newRun(dailyCfg());return;
    case 'again':if(S&&S.daily){UI.scene='setup';break}newRun(UI.lastCfg||{heat:S?S.heat:0,mods:S?S.mods:[]});return;
    case 'heat':UI.setup.heat=Math.max(0,Math.min(M.heatMax,UI.setup.heat+(+v)));break;
    case 'modt':{const m=UI.setup.mods;UI.setup.mods=m.includes(v)?m.filter(x=>x!==v):m.concat([v]);break}
    case 'start':newRun({heat:UI.setup.heat,mods:UI.setup.mods.slice()});return;
    case 'leg':buyLegacy(v);break;
    case 'ltab':UI.ltab=v;break;
    case 'ttab':UI.ttab=v;break;
    case 'ward':{const[sl,id]=v.split(':');wardAct(sl,id);break}
    case 'ext':extDebt(+v);break;
    case 'cancel':UI.confirm=null;break;
    case 'mute':M.mute=!M.mute;break;
    case 'tab':UI.tab=v;UI.confirm=null;break;
    case 'pay':payDebt(+v);break;
    case 'bankrupt':UI.confirm='bankrupt';break;
    case 'bkyes':gameOver('bankrupt');return;
    case 'sleep':if(S.debts.some(d=>d.due<=S.day)){UI.confirm='sleep';break}sleep();return;
    case 'sleepyes':gameOver('collectors');return;
    case 'skill':buySkill(v);break;
    case 'stk':{const[k,q]=v.split(':');stockTrade(k,q);break}
    case 'buy':martBuy(v);break;
    case 'drink':barBuy();break;
    case 'bet':{const c=Math.floor(S.cash);let b=clampBet();if(v==='-10')b-=10;else if(v==='+10')b+=10;else if(v==='x2')b*=2;else if(v==='half')b=Math.floor(b/2);else if(v==='max')b=c;UI.bet=Math.max(1,Math.min(c,b));break}
    case 'bj':bjAct(v);return;
    case 'rlnum':rlTap(+v);return;
    case 'rlout':rlPlace(v);return;
    case 'rlpick':rlPlace(v);return;
    case 'rlcancel':UI.rlPick=null;break;
    case 'rlmode':S.g.rl.mode=v;UI.rlPick=null;break;
    case 'rldel':delete S.g.rl.bets[v];break;
    case 'rlclear':S.g.rl.bets={};UI.rlPick=null;break;
    case 'rldouble':{const s=S.g.rl,t=rlTotal();if(t*2>S.cash||(mod('low')&&t*2>250)){toast('Not enough room to double.');return}for(const k in s.bets)s.bets[k]*=2;break}
    case 'rlspin':rlSpin();return;
    case 'pldrop':plDrop();return;
    case 'mn':mnAct(v,el.dataset.i);return;
    case 'fl':flAct(v);return;
    case 'snpick':S.g.sn.pick=+v;break;
    case 'snrace':snRace();return;
    case 'sl':slSpin();return;
    case 'wh':whSpin();return;
    case 'whpick':S.g.wh.pick=v;break;
    case 'bc':bcPlay();return;
    case 'bcpick':S.g.bc.pick=v;break;
    case 'cr':crStart();return;
    case 'crcash':crCash();return;
    case 'crauto':S.g.cr.auto=+v;break;
    case 'tw':twAct(v,el.dataset.i);return;
    case 'kn':knAct(v,el.dataset.i);return;
    case 'vp':vpAct(v,el.dataset.i);return;
    case 'pg':pgAct(v,el.dataset.i);return;
    case 'pk':
      if(v==='sit'){if(!canPlay())return;const b=clampBet();if(b<20){toast('Poker needs a buy-in of at least <b>$20</b>.');return}pkSit(b);return}
      if(v==='deal'){pkDeal();return}
      if(v==='leave'){pkLeave();return}
      if(v==='fold'){pkAction(0,'fold');return}if(v==='call'){pkAction(0,'call');return}if(v==='raise'){pkAction(0,'raise',+el.dataset.i);return}return;
  }
  save();render();
  if(UI.scene!==lastScene){window.scrollTo(0,0);lastScene=UI.scene}
}
const QUIET=['bj','rlspin','rlnum','rlout','rlpick','pldrop','mn','fl','snrace','pk','sl','wh','bc','cr','crcash','tw','kn','vp','pg','interact'];
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(!QUIET.includes(b.dataset.a))SFX.click();
  act(b.dataset.a,b.dataset.v,b);
});
app.addEventListener('pointerdown',e=>{
  if(UI.scene!=='world')return;
  const mb=e.target.closest('[data-move]');
  if(mb){e.preventDefault();UI.move=+mb.dataset.move;UI.target=null;UI.pending=null;startLoop();return}
  const cv=e.target.closest('canvas[data-s="world"]');
  if(cv){e.preventDefault();const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*160,wx=camX()+X,w=roomW(UI.room);
    let sp=null,bd=16;for(const s of roomSpots(UI.room)){const d=Math.abs(s.x-wx);if(d<bd){bd=d;sp=s}}
    UI.target=sp?sp.x:Math.max(8,Math.min(w-8,wx));UI.pending=sp?sp.id:null;startLoop()}
});
app.addEventListener('input',e=>{if(e.target.id!=='betin')return;const d=e.target.value.replace(/[^0-9]/g,'');if(d!==e.target.value)e.target.value=d;UI.bet=parseInt(d,10)||0});
app.addEventListener('change',e=>{if(e.target.id!=='betin')return;const b=clampBet();UI.bet=b;e.target.value=b;save()});
app.addEventListener('keydown',e=>{if(e.target.id==='betin'&&e.key==='Enter'){e.preventDefault();e.target.blur()}});
app.addEventListener('focusin',e=>{if(e.target.id==='betin'){try{e.target.select()}catch(_){}}});
const stopMove=()=>{UI.move=0};
window.addEventListener('pointerup',stopMove);window.addEventListener('pointercancel',stopMove);window.addEventListener('blur',stopMove);
app.addEventListener('contextmenu',e=>{if(e.target.closest('[data-move],canvas[data-s="world"]'))e.preventDefault()});
document.addEventListener('keydown',e=>{
  if(UI.scene!=='world'||e.repeat&&!['ArrowLeft','ArrowRight'].includes(e.key))return;
  if(e.key==='ArrowLeft'||e.key==='a'){UI.move=-1;UI.target=null;startLoop();e.preventDefault()}
  else if(e.key==='ArrowRight'||e.key==='d'){UI.move=1;UI.target=null;startLoop();e.preventDefault()}
  else if((e.key===' '||e.key==='ArrowUp'||e.key==='Enter')&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('button'))){const sp=nearSpot();if(sp){e.preventDefault();interact(sp.id)}}
});
document.addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d'].includes(e.key))UI.move=0});
window.addEventListener('resize',()=>{fitPix();drawScenes()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitPix()});
render();lastScene=UI.scene;
})();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
